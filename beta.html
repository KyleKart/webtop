<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webtop Beta</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-url: url('https://kylekart.github.io/webtop/backgrounds/borealis2.png');
            --glass-dark: rgba(10, 10, 10, 0.88);
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --accent: #4285f4;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            background: var(--bg-url) no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
        }

        .desktop {
            height: calc(100% - 64px);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .widget {
            width: 320px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .widget h3 {
            margin: 0 0 8px 0;
            font-size: 0.7rem;
            font-weight: 800;
            opacity: 0.4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shelf {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: var(--glass-dark);
            backdrop-filter: blur(30px);
            border-top: 1px solid var(--border);
            border-radius: 25px 25px 0 0;
            display: flex;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
            left: 48px;
            right: 48px;
        }

        .shelf-start {
            flex: 1;
            display: flex;
            align-items: left;
        }

        .shelf-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .shelf-end {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }

        .app-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 0 5px;
            width: auto;
            height: 35px;
            transition: all 0.2s ease;
            border-radius: 14px;
        }

        .start-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 0 5px;
            width: 35px;
            height: 35px;
            transition: all 0.2s ease;
            border-radius: 14px;
        }

        .app-item svg {
            height: 24px;
            width: auto;
        }

        .app-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .app-item:hover,
        .launcher-item,
        .start-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .app-item:hover .app-label {
            color: var(--text-main);
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: default;
        }

        .time-module {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            line-height: 1.1;
            padding: 0 6px;
        }

        #clock {
            font-size: 14px;
            color: var(--text-main);
        }

        #date {
            font-size: 14px;
            color: var(--text-dim);
        }

        .gemini-icon {
            background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-grid {
            position: absolute;
            top: 14px;
            left: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 68px);
            grid-auto-flow: column;
            grid-template-rows: repeat(auto-fill, 68px);
            height: calc(100% - 150px);
            pointer-events: none;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 68px);
            grid-auto-flow: column;
            grid-template-rows: repeat(auto-fill, 68px);
            pointer-events: none;
            height: 300px;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            cursor: pointer;
            border-radius: 14px;
            transition: background 0.2s;
            pointer-events: auto;
        }

        .desktop-icon svg {
            height: 24px;
            width: auto;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .desktop-icon span {
            font-size: 12px;
            margin-top: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            font-weight: 500;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .start-menu {
            position: absolute;
            bottom: 48px;
            left: 72px;
            width: 320px;
            height: auto;
            max-height: 80vh;
            background: #1a1a1a;
            border: 1px solid #333;
            z-index: 9999;
            border-radius: 14px 14px 0px 0px;
        }

        #start-menu[hidden] {
            display: none !important;
        }

        .search-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-top: 1px solid #333;
        }

        .search-container {
            display: flex;
            align-items: center;
            flex-grow: 1;
            background: #000;
            border: 1px solid #333;
            padding: 4px 8px;
            border-radius: 14px;
        }

        .search-container:focus-within {
            border-color: #0055ff;
        }

        .settings-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
        }

        .settings-btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="desktop">
        <div class="widget" style="display:none;">
            <h3>Kernel Metadata</h3>
            <p>Timezone: UTC-4<br>Format: ISO-8601<br>Status: Nominal</p>
        </div>
        <div class="icon-grid">
            <div class="desktop-icon">
                <i data-lucide="hard-drive"></i>
                <span>Root</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="folder-kanban"></i>
                <span>Projects</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="file"></i>
                <span>file.txt</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="trash-2"></i>
                <span>Trash</span>
            </div>
        </div>
    </div>

    <div id="start-menu" class="start-menu" hidden>
        <div class="app-grid">
            <div class="desktop-icon">
                <i data-lucide="hard-drive"></i>
                <span>Root</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="folder-kanban"></i>
                <span>Projects</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="file"></i>
                <span>file.txt</span>
            </div>
            <div class="desktop-icon">
                <i data-lucide="trash-2"></i>
                <span>Trash</span>
            </div>
        </div>

        <div class="search-section">
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" class="search-input" placeholder="Search...">
            </div>

            <button class="app-item settings-btn">
                <i data-lucide="sliders-horizontal"></i>
            </button>
        </div>
    </div>

    <div class="shelf">
        <div class="shelf-start">
            <div class="app-item" id="apps-menu"><i data-lucide="grip"></i></div>
        </div>

        <div class="shelf-center">
            <div class="app-item"><i data-lucide="globe"></i><span class="app-label">Browser</span></div>
            <div class="app-item"><i data-lucide="terminal"></i><span class="app-label">Terminal</span></div>
            <div class="app-item"><i data-lucide="folder"></i><span class="app-label">Files</span></div>
            <div class="app-item"><i data-lucide="command"></i><span class="app-label">Command</span></div>
        </div>

        <div class="shelf-end">
            <div class="status-group">
                <i data-lucide="wifi" size="16"></i>
                <i data-lucide="battery-full" size="16"></i>
                <div class="time-module">
                    <span id="date">00-00</span>
                    <span id="clock">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function updateDateTime() {
            const now = new Date();

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hh}:${mm}`;

            const yyyy = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').textContent = `${month}-${dd}`;
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        const trigger = document.getElementById('apps-menu');
        const menu = document.getElementById('start-menu');

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();

            const isHidden = menu.hasAttribute('hidden');

            if (isHidden) {
                menu.removeAttribute('hidden');
                setTimeout(() => {
                    document.querySelector('.search-input')?.focus();
                }, 50);
            } else {
                menu.setAttribute('hidden', '');
            }
        });

        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && e.target !== trigger) {
                menu.setAttribute('hidden', '');
            }
        });
    </script>
</body>

</html>
