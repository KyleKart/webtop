<body>
  <div
    id="loading-mask"
    style="
    position:fixed;
    top:0;right:0;bottom:0;left:0;
    background:black;
    opacity:1;
    text-align:center;
    z-index : 20000;
    transition:opacity 0.5s;
    color:#00ff00;
    font-family:monospace;">
      <span style="position:relative; top:45%; font-size:18px; letter-spacing:2px;">[ LOADING SYSTEM MODULES ... ]</span>
  </div>
  <style type="text/css">
  #main-wrapper {
    margin-top: 40px;
  }

  /* Modified header to look like a high-contrast industrial dashboard terminal */
  .fake-piskelapp-header {
    position: relative;
    text-align: left;
    padding-left: 15px;
    height: 40px;
    line-height: 40px;
    font-size: 16px;
    font-family: monospace;
    background: #111111;
    color: #ffffff;
    border-bottom: 2px solid #333333;
    z-index: 100;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .piskel-name.piskel-name-saving {
    color: #ff3333;
    font-weight: bold;
  }

  /* Eliminated rounded corners, forced strict squared edges */
  .new-piskel-desktop {
    position: absolute;
    display: flex;
    top: 7px;
    right: 7px;
    height: 26px;
    width: 26px;
    border-radius: 0px !important; 
    font-size: 18px;
    font-family: monospace;
    font-weight: bold;
    color: black;
    background: #ffffff;
    text-decoration: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #333333;
  }
  
  .new-piskel-desktop:hover {
    background: #00ff00;
  }

  /* Global theme override overrides for an Industrial/Terminal aesthetic */
  body, .main-wrapper, .column, .toolbox-container, .sticky-section {
    font-family: monospace !important;
  }

  .toolbox-container, .sticky-section, .button, input, select, textarea {
    border-radius: 0px !important; /* Forced square alignment across all widgets */
  }

  .terminal-sys-log {
    font-size: 12px;
    color: #00ff00;
    background: #000000;
    padding: 2px 8px;
    border: 1px solid #222222;
    margin-left: 20px;
    display: inline-block;
    height: 20px;
    line-height: 20px;
  }
</style>
<div class="fake-piskelapp-header">

    <strong>SYS://PISKEL_FORK</strong>
    <span class="terminal-sys-log" id="sys-status-readout">STATUS: ONLINE</span>
  </div>
  <a

    target="_blank"

    title="Create a new sprite"
    rel="tooltip"
    data-placement="left"
    >+</a>
  <span class="piskel-name"></span>
</div>

  <script type="text/javascript">
    (function () {
  var version = '-2025-05-26-10-16';
  var versionHasNotBeenReplaced = version.indexOf('@@') === 0;
  if (versionHasNotBeenReplaced)  {
    version = '';
  }

  if (!window.piskelReadyCallbacks) {
    window.piskelReadyCallbacks = [];
  }

  window._onPiskelReady = function () {
    var loadingMask = document.getElementById('loading-mask');
    loadingMask.style.opacity = 0;
    window.setTimeout(function () {loadingMask.parentNode.removeChild(loadingMask);}, 600);
    pskl.app.init();
    pskl._releaseVersion = '0.15.2-SNAPSHOT';
    
    // Injected terminal status update hook when Piskel finishes internal initialization
    var readout = document.getElementById('sys-status-readout');
    if(readout) readout.innerText = "STATUS: LIVE_SNAPSHOT_0.15.2";

    delete window.pskl_exports;
    delete window.loadDebugScripts;
    delete window.done;

    for (var i = 0; i < window.piskelReadyCallbacks.length; i++) {
      window.piskelReadyCallbacks[i]();
    }
  };

  var prefixPath = function (path) {
    if (window.pskl && window.pskl.appEngineToken_) {
      return '../' + path;
    } else {
      return path;
    }
  };

  var loadScript = function (src, callback) {
    src = prefixPath(src);
    var script = window.document.createElement('script');
    script.setAttribute('src',src);
    script.setAttribute('onload',callback);
    window.document.body.appendChild(script);
  };

  var loadStyle = function (src) {
    src = prefixPath(src);
    var link = document.createElement('link');
    link.setAttribute('href', src);
    link.setAttribute('rel', 'stylesheet');
    link.setAttribute('type', 'text/css');
    document.head.appendChild(link);
  };

  if (window.location.href.indexOf('debug') != -1) {
    window.pskl_exports = {};
    var scriptIndex = 0;
    window.loadNextScript = function () {
      if (scriptIndex == window.pskl_exports.scripts.length) {
        window._onPiskelReady();
      } else {
        loadScript(window.pskl_exports.scripts[scriptIndex], 'loadNextScript()');
        scriptIndex ++;
      }
    };
    loadScript('piskel-script-list.js', 'loadNextScript()');

    var styles;
    window.loadStyles = function () {
      styles = window.pskl_exports.styles;
      for (var i = 0 ; i < styles.length ; i++) {
        loadStyle(styles[i]);
      }
    };
    loadScript('piskel-style-list.js', 'loadStyles()');
  } else {
    var script;
    if (window.location.href.indexOf('pack') != -1) {
      script = 'js/piskel-packaged' + version + '.js';
    } else {
      script = 'js/piskel-packaged-min' + version + '.js';
    }

    loadStyle('css/piskel-style-packaged' + version + '.css');
    loadScript(script, '_onPiskelReady()');
  }
})();
  </script>

  <script type="text/javascript">
(function() {
  // Wait to see if Piskel actually renders its workspace properly
  setTimeout(function() {
    var nativeCanvasBackground = document.querySelector('#drawing-canvas-container .canvas-background');
    
    // Strict Verification: If the native application successfully booted, 
    // it will have injected style or child elements into the canvas background.
    // If it's completely empty or missing components, the native engine failed.
    if (nativeCanvasBackground && nativeCanvasBackground.children.length > 0) {
      console.log("[SYS] Native Piskel core verified operational. Custom script idling.");
      return;
    }
    
    // Forcefully override the broken native state and mount the working matrix canvas
    console.warn("[SYS] Piskel core structural breakdown detected (Components Undefined). Forcing custom canvas override...");
    launchCustomMatrixEngine();
  }, 1500); // 1.5 seconds gives the native scripts plenty of time to try initializing

  function launchCustomMatrixEngine() {
    console.log("[SYS] Initiating Standalone Pixel Engine...");
    
    // Force clear the loading mask if it got stuck during the native crash
    var mask = document.getElementById('loading-mask');
    if (mask) {
      var loadText = mask.querySelector('span');
      if (loadText) loadText.innerText = "[ OVERRIDING SYSTEM ERROR: MOUNTING MATRIX... ]";
      setTimeout(function() {
        mask.style.opacity = 0;
        setTimeout(function() { mask.remove(); }, 500);
      }, 400);
    }

    // Update your industrial terminal system readout
    var statusReadout = document.getElementById('sys-status-readout');
    if (statusReadout) {
      statusReadout.innerText = "STATUS: OVERRIDE_MATRIX_LIVE";
      statusReadout.style.color = "#ff3333"; // Alert styling for manual bypass mode
    }

    // Capture workspace container
    var canvasContainer = document.getElementById('drawing-canvas-container');
    if (!canvasContainer) return;
    canvasContainer.innerHTML = ''; // Wipe out any stale, non-functional framework shells

    // Create the square drawing canvas element
    var canvas = document.createElement('canvas');
    canvas.id = 'fallback-matrix-canvas';
    canvas.width = 512;
    canvas.height = 512;
    canvas.style.backgroundColor = '#151515';
    canvas.style.border = '2px solid #333333';
    canvas.style.cursor = 'crosshair';
    canvas.style.imageRendering = 'pixelated';
    canvasContainer.appendChild(canvas);

    var ctx = canvas.getContext('2d');
    var matrixResolution = 32; // 32x32 pixel matrix
    var pixelSize = canvas.width / matrixResolution;
    
    // Initialize standard blank matrix map
    var pixelMap = Array(matrixResolution).fill(null).map(function() {
      return Array(matrixResolution).fill(null);
    });

    var isPainting = false;
    var currentMode = 'pencil'; 

    // Wire into the color input that's natively present in your HTML
    var colorInput = document.getElementById('color-picker');

    // Setup clear canvas control logic
    var clearBtn = document.getElementById('clear-canvas-btn');
    if (clearBtn) {
      clearBtn.onclick = function() {
        pixelMap = Array(matrixResolution).fill(null).map(function() { return Array(matrixResolution).fill(null); });
        renderFrame();
      };
    }

    // Main Layout Renderer Loop
    function renderFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render saved structural elements from matrix memory
      for (var r = 0; r < matrixResolution; r++) {
        for (var c = 0; c < matrixResolution; c++) {
          if (pixelMap[r][c]) {
            ctx.fillStyle = pixelMap[r][c];
            ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize);
          }
        }
      }

      // Draw faint industrial grid lines
      ctx.strokeStyle = '#252525';
      ctx.lineWidth = 1;
      for (var i = 0; i <= matrixResolution; i++) {
        ctx.beginPath();
        ctx.moveTo(i * pixelSize, 0);
        ctx.lineTo(i * pixelSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * pixelSize);
        ctx.lineTo(canvas.width, i * pixelSize);
        ctx.stroke();
      }
    }

    // Plot grid tracking updates
    function plotPixel(e) {
      var rect = canvas.getBoundingClientRect();
      var mouseX = e.clientX - rect.left;
      var mouseY = e.clientY - rect.top;

      var col = Math.floor(mouseX / (rect.width / matrixResolution));
      var row = Math.floor(mouseY / (rect.height / matrixResolution));

      if (col >= 0 && col < matrixResolution && row >= 0 && row < matrixResolution) {
        if (currentMode === 'pencil') {
          var targetColor = '#00ff00';
          // Pull value dynamically from your index.html picker layout element
          if (colorInput) targetColor = colorInput.value || '#00ff00';
          pixelMap[row][col] = targetColor;
        } else {
          pixelMap[row][col] = null;
        }
        renderFrame();
      }
    }

    // Direct mouse bindings
    canvas.addEventListener('mousedown', function(e) { isPainting = true; plotPixel(e); });
    canvas.addEventListener('mousemove', function(e) { if (isPainting) plotPixel(e); });
    window.addEventListener('mouseup', function() { isPainting = false; });

    // Initial paint run
    renderFrame();
  }
})();
</script>
